# Nombre fijo del proyecto (08-oct-2026): sin él, Compose usaba el nombre de
# la carpeta ("docker"), el mismo que el Airflow viejo levantado sin
# --env-file, y los mezclaba como contenedores huérfanos del mismo proyecto.
name: sietel_dashboard

services:
  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: sietel_dashboard
    restart: unless-stopped
    ports:
      # Puerto propio -- no choca con samm_pipeline (8080) ni sietel_pipeline
      # (8081) en VM2, mismo criterio que ya se usó para evitar ese
      # conflicto en docker/docker-compose.yml del pipeline.
      - "8050:8050"
    env_file:
      - ../.env
    # Sin volúmenes de datos: el dashboard no persiste nada localmente,
    # todo vive en PostgreSQL (VM1). Un restart limpio no pierde información.
