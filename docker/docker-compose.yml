x-airflow-common:
  &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    # Metadata de Airflow en el PostgreSQL bare-metal de VM1 (mismo patron
    # que samm_pipeline, que tampoco levanta un postgres de metadata en
    # Docker). Requiere que la base y el usuario ya existan en VM1 antes de
    # levantar este stack -- ver seccion de puesta en marcha en el README.
    # Variables definidas mas abajo, ver .env.
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_METADATA_PG_USER}:${AIRFLOW_METADATA_PG_PASSWORD}@${AIRFLOW_METADATA_PG_HOST}:${AIRFLOW_METADATA_PG_PORT:-5432}/${AIRFLOW_METADATA_PG_DATABASE}
    AIRFLOW__CORE__FERNET_KEY: '${AIRFLOW__CORE__FERNET_KEY}'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    # Limita concurrencia: no saturar SQL Server SIETEL sin indices en
    # produccion. Confirmado con Ivan (2026-07-22): valor definitivo = 1.
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: '1'
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: '${_AIRFLOW_WWW_USER_USERNAME}:admin'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-webserver:8080/execution/'
    AIRFLOW__API_AUTH__JWT_SECRET: '${AIRFLOW__API_AUTH__JWT_SECRET}'
    # Timeouts para tareas largas (extraccion agregada de VALineasDedicadas
    # puede tardar varios minutos por mes/anio historico)
    AIRFLOW__CORE__TASK_TIMEOUT: 900
    AIRFLOW__CORE__KILLED_TASK_CLEANUP_TIME: 300
    AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: 300
    # Pool de conexiones a la BD de metadata de Airflow (VM1) -- valor
    # compartido por defecto para scheduler/triggerer/dag-processor, que no
    # sirven la UI y no necesitan un pool grande. airflow-webserver
    # sobreescribe estos dos valores mas abajo (ver 22-jul-2026: agotamiento
    # de pool por polling de la UI durante carga historica de 8 anios).
    AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_SIZE: 10
    AIRFLOW__DATABASE__SQL_ALCHEMY_MAX_OVERFLOW: 10
    AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_RECYCLE: 3600
    AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_PRE_PING: 'true'
    PYTHONPATH: '/opt/airflow'
    # Credenciales SIETEL / Postgres analitico, inyectadas desde .env
    SIETEL_SQLSERVER_HOST: ${SIETEL_SQLSERVER_HOST}
    SIETEL_SQLSERVER_PORT: ${SIETEL_SQLSERVER_PORT:-1433}
    SIETEL_SQLSERVER_USER: ${SIETEL_SQLSERVER_USER}
    SIETEL_SQLSERVER_PASSWORD: ${SIETEL_SQLSERVER_PASSWORD}
    SIETEL_SQLSERVER_DATABASE: ${SIETEL_SQLSERVER_DATABASE}
    ANALITICO_PG_HOST: ${ANALITICO_PG_HOST}
    ANALITICO_PG_PORT: ${ANALITICO_PG_PORT:-5432}
    ANALITICO_PG_USER: ${ANALITICO_PG_USER}
    ANALITICO_PG_PASSWORD: ${ANALITICO_PG_PASSWORD}
    ANALITICO_PG_DATABASE: ${ANALITICO_PG_DATABASE}
  volumes:
    - ../dags:/opt/airflow/dags
    - ../scripts:/opt/airflow/scripts
    - ../sql:/opt/airflow/sql
    - airflow_logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    airflow-init:
      condition: service_completed_successfully

services:
  # NOTA: no se levanta un airflow-metadata-db en Docker. La metadata de
  # este Airflow vive en el PostgreSQL bare-metal de VM1, igual que la de
  # samm_pipeline (dos bases distintas en la misma instancia bare-metal:
  # revisar que "airflow_metadata_sietel" -- o el nombre que definas -- ya
  # exista con su usuario antes del primer "docker compose up airflow-init").

  airflow-webserver:
    <<: *airflow-common
    environment:
      <<: *airflow-common-env
      # Pool ampliado solo aqui: es el unico componente que sirve la UI/API
      # HTTP y valida el token contra la metadata db en cada request. Con
      # polling activo de la UI durante una carga historica larga (8 anios
      # en serie), 10+10 se agotaba (TimeoutError, QueuePool limit
      # reached). scheduler/triggerer/dag-processor no sirven trafico HTTP
      # y se quedan en el valor compartido de arriba (10/10) -- no
      # necesitan el mismo margen, y subir los 4 componentes por igual
      # arriesgaria el max_connections=100 compartido con samm_pipeline en
      # la misma instancia de VM1 (verificado 22-jul-2026: 22/100 en uso).
      AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_SIZE: 20
      AIRFLOW__DATABASE__SQL_ALCHEMY_MAX_OVERFLOW: 30
    command: api-server
    ports:
      - "${AIRFLOW_WEBSERVER_PORT:-8081}:8080"   # 8080 ya esta en uso por samm_pipeline en VM2
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health" ]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 90s
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: [ "CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"' ]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 90s
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: [ "CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"' ]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 90s
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: [ "CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"' ]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 90s
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        one_meg=1048576
        mem_available=$$(($$(getconf _PHYS_PAGES) * $$(getconf PAGE_SIZE) / one_meg))
        cpus_available=$$(grep -cE 'cpu[0-9]+' /proc/stat)
        disk_available=$$(df / | tail -1 | awk '{print $$4}')
        disk_available=$$(($${disk_available} / one_meg))
        if (( mem_available < 4000 )); then
          echo -e "\033[1;33mWARNING: Not enough memory. At least 4GB required.\e[0m"
        fi
        if (( cpus_available < 2 )); then
          echo -e "\033[1;33mWARNING: At least 2 CPUs recommended.\e[0m"
        fi
        if (( disk_available < 10 )); then
          echo -e "\033[1;33mWARNING: At least 10 GiB disk recommended.\e[0m"
        fi
        mkdir -p /sources/logs /sources/dags /sources/plugins
        chown -R "${AIRFLOW_UID}:0" /sources/{logs,dags,plugins}
        exec /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
    user: "0:0"
    volumes:
      - ./airflow:/sources
    depends_on: { }

volumes:
  airflow_logs: { }